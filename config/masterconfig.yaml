# path of the LIFEredoxsurvey repo
REPO_path: "/Users/users/borgmann/Documents/masterproject/LIFEredoxsurvey"

# Especially the ARCiS files get huge, close to 100 GBs.
# I don't want to save this in the repo, so I save it to a data server
dataserver_path: "/dataserver/users/formingworlds/borgmann"

# EVo
# Define the fo2 parameters you want as inputs
FO2_start: -4
FO2_stop: 4
FO2_steps: 4

# Define the C/H ratios you want as inputs by changing H amount
ATOMIC_H_start: 100 # atomic C = 200; plots will show C/H fractions
ATOMIC_H_stop: 600
ATOMIC_H_steps: 4

# AGNI
AGNI_rootpath: "/dataserver/users/formingworlds/borgmann/AGNI"
AGNI_outputpath: "/dataserver/users/formingworlds/borgmann/AGNI/out"
SOCRATES_path: "/dataserver/users/formingworlds/borgmann/AGNI/usr/SOCRATES"

# if True, dumps all raw AGNI data to BIGDATA_path. Not necessary, but is useful for tracking bugs
AGNI_DUMP_RAW: True
# fastchem
fastchem_rootpath: "/dataserver/users/formingworlds/borgmann/fastchem"

# ARCiS
observingdistances: [5, 10, 15, 20]

# LIFEsim
integrationtimes: [36000,1261440] # seconds

# p-pop
PPOP_rootpath: "/dataserver/users/formingworlds/borgmann/p-pop/P-pop"